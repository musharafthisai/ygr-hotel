version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_NAME: briyani_shop
      DB_USER: root
      DB_PASS: rootpass
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./assets/img/items:/var/www/html/assets/img/items

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: briyani_shop
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./install/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
